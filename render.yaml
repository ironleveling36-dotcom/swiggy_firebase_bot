services:
  - type: worker
    name: swiggy-firebase-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
    disk:
      name: sessions
      mountPath: /opt/render/project/src/sessions
      sizeGB: 1
